# Phase 1 checkpoint — hand-checked call graph for eval/fixtures/flaskr
# (pallets/flask examples/tutorial @ d73fa1cdcbd8b1465c151db8924ba58b1dd14e35).
#
# Written by reading the source, *before* running Ravel on it. Functions are
# named "file::qualified_name" (the qualified name as Ravel's parser builds it).
#
# Revision (2026-09-27), made AFTER the first run — flagged so reviewers can
# weigh it: the 11 `auth.login()` / `auth.logout()` edges under "pytest
# fixtures" below were first recorded as unknowable. They are real: each test
# takes the `auth` fixture, which returns `AuthActions(client)` (conftest.py:61),
# and Jedi follows pytest fixture injection. Each edge was re-verified against
# its source line. An independent re-check of this file is still wanted.
#
# [[edge]]     — an in-repo call that MUST resolve to a `calls` edge.
#                The list is EXHAUSTIVE: every call from repo code to a repo
#                function/class is here, so any other resolved internal edge
#                Ravel emits is a false positive (edge precision).
# [[no_edge]]  — a call that looks like an in-repo call by name but is not
#                statically resolvable (or is not a call at all). Ravel must
#                NOT draw this edge; where `unknown` is set, the call site must
#                instead survive as an `unknown::<name>` edge (PRODUCT.md §6).
# [[unknown]]  — a dynamic call with no plausible static target: it must be
#                kept as an `unknown::<name>` edge from `src`, never dropped.

