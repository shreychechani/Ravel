[project]
name = "ravel"
version = "0.0.1"
description = "Reachability-aware security triage for Python codebases"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "networkx>=3.3",
    "jedi>=0.19",
    "grimp>=3.4",
    "gitpython>=3.1",
]

[project.scripts]
ravel = "ravel.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ravel"]

[tool.ruff]
line-length = 100
src = ["ravel", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ravel", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
