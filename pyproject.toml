[project]
name = "ravel"
version = "0.0.1"
description = "Reachability-aware security triage for Python codebases"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "tree-sitter>=0.23,<0.26",  # 0.26.0 segfaults walking real code (eval/fixtures/pygoat_views)
    "tree-sitter-python>=0.23",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "networkx>=3.3",
    "jedi>=0.19",
    "gitpython>=3.1",
    "bandit>=1.9.4",
    "packaging>=26.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
ravel = "ravel.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ravel"]

[tool.ruff]
line-length = 100
src = ["ravel", "tests"]
# Vendored third-party code kept byte-identical to upstream, and planted-bug fixtures.
extend-exclude = ["eval/benchmarks", "eval/fixtures/flaskr", "eval/fixtures/vuln_shop", "eval/fixtures/pygoat_views"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ravel", "tests", "eval/graph_checkpoint.py", "eval/pycg_bench.py", "eval/dynamic_recall.py", "eval/oracle"]

# jedi ships no py.typed marker; networkx stubs are third-party and partial.
[[tool.mypy.overrides]]
module = ["jedi.*", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
